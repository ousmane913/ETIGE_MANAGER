services:
  - type: web
    name: etige-manager
    runtime: python
    buildCommand: bash build.sh
    preDeployCommand: python manage.py migrate && python manage.py setup_roles && python manage.py create_superuser
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 3
    healthCheckPath: /health/
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_ALLOWED_HOSTS
        value: "etige-manager.onrender.com"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://etige-manager.onrender.com"
      - key: DATABASE_URL
        fromDatabase:
          name: etige-manager-db
          property: connectionString

databases:
  - name: etige-manager-db
    plan: free
    databaseName: etige_manager
    user: etige_db_user
